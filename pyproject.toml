[project]
name = "agentsearchhelper"
version = "0.1.0"
description = "A local CLI tool to query SearXNG and summarize web results using a local LLM server (llama.cpp)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "trafilatura>=1.8.0",
    "click>=8.1.7",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "lxml-html-clean>=0.1.0",
]

[project.scripts]
agentsearchhelper = "agentsearchhelper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
